name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # GitHub-hosted runners restrict the namespaces used by existing pnut
      # integration tests, so compile their complete graph as the runner user.
      - name: Compile workspace tests
        run: cargo test --workspace --no-run

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check man pages are up-to-date
        run: |
          sudo apt-get install -y scdoc mandoc
          doc/generate.sh
          git diff --exit-code doc/pnut.1 doc/pnut.toml.5
          mandoc -W error doc/pnut.1
          mandoc -W error doc/pnut.toml.5

      # Run namespace-dependent tests only after all runner-owned work: sudo
      # can create root-owned target files, so privileged steps stay last.
      - name: Test workspace with required privileges
        run: sudo -E env "HOME=$HOME" "PATH=$PATH" cargo test --workspace

      # This additionally exercises completion evidence through pivot and a
      # dynamic ELF exec. It remains ignored for ordinary local test runs.
      - name: Privileged completion evidence integration test
        run: sudo -E env "HOME=$HOME" "PATH=$PATH" cargo test -p pnut-child --test completion -- --ignored --test-threads=1
